name: windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pytest
      - run: python -m pytest tests -q
      - name: Panel opens and closes
        run: python coach.py --smoke
      - run: .\build.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: WeChatCoach-windows
          path: windows/dist/WeChatCoach.exe
